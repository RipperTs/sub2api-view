[project]
name = "sub2api-view"
version = "0.1.0"
description = "A minimal Python and HTML web app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
