services:
  sub2api-view:
    image: registry.cn-hangzhou.aliyuncs.com/ripper/sub2api-view
    container_name: sub2api-view
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_RELOAD: false
      SUB2API_BASE_URL: http://host.docker.internal:8080
      SUB2API_ADMIN_KEY: your-admin-api-key
      SUB2API_JWT_SECRET: your-sub2api-jwt-secret
      AUTO_RESET_ENABLED: true
      AUTO_RESET_INTERVAL_SECONDS: 180
